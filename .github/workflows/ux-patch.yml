name: Patch Lecture Helper UX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ux-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX patch
        run: python tools/ux_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1/index.html v2/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Improve page navigation and Pencil input UX"
            git push
          fi
