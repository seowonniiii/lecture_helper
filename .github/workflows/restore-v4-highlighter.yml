name: Patch Lecture Helper V4

on:
  push:
    paths:
      - 'tools/restore_v4_highlighter.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V4 patch
        run: python tools/restore_v4_highlighter.py
      - name: Validate JavaScript syntax
        run: node --check v4/app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4/app.js v4/index.html v4/styles.css
          git diff --cached --quiet || git commit -m "Improve Lecture Helper V4 workflow"
          git push
