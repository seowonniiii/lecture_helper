name: Restore V4 highlighter

on:
  push:
    paths:
      - 'tools/restore_v4_highlighter.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore V2-style highlighter in V4
        run: python tools/restore_v4_highlighter.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4/app.js
          git diff --cached --quiet || git commit -m "Restore V2-style highlighter in V4"
          git push
