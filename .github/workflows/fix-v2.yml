name: Fix V2 initial annotation restore

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V2 initial page restore
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('v2/index.html')
          s = p.read_text(encoding='utf-8')
          old = "async function go(n){if(!pdfDoc)return;if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await saveNoteNow()}await savePageData();currentPage="
          new = "async function go(n){if(!pdfDoc)return;if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await saveNoteNow()}currentPage="
          if old not in s:
              raise SystemExit('Target code not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/index.html
          git commit -m "Fix V2 annotation restore on reopen"
          git push
