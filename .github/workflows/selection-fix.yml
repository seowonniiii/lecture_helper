name: Apply iPad Selection Fix

on:
  push:
    branches: [main]
    paths:
      - tools/selection_fix.py
      - .github/workflows/selection-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply selection fix
        run: python tools/selection_fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Prevent text selection while writing with Apple Pencil"
            git push
          fi
