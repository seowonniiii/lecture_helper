<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Lecture Helper V4</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">LH</div><div><b>Lecture Helper <span style="color:#7c3aed">V4</span></b><small id="status">PDF를 열어주세요</small></div></div>
  <div class="actions"><label class="btn primary">PDF 열기<input id="pdfInput" type="file" accept="application/pdf" hidden></label><label class="btn backup">백업 복원<input id="backupInput" type="file" accept="application/json" hidden></label></div>
</header>
<main id="shell" class="shell">
  <section class="viewer">
    <div class="toolbar">
      <div class="nav"><button id="prev" class="btn">‹ 이전</button><input id="page" type="number" min="1" value="1"><span>/ <b id="total">0</b></span><button id="next" class="btn">다음 ›</button></div>
      <div class="titleline"><input id="title" class="title" placeholder="강의 제목"><span id="inputBadge" class="badge">✏️ Pencil · 👆 손가락 이동</span><label class="viewselect">동시보기 <select id="viewCount" class="tool"><option value="1">1쪽</option><option value="2">2쪽</option><option value="3">3쪽</option><option value="4">4쪽</option></select></label><button id="layoutToggle" class="tool layout-toggle">코멘트 ↓</button></div>
      <div class="toolrow"><button class="tool active" data-tool="pen">✏️ 펜</button><button class="tool" data-tool="highlight">🖍 형광펜</button><button class="tool" data-tool="erase">⌫ 지우개</button><button class="tool" data-tool="pin">📌 핀</button><input id="inkColor" class="color" type="color" value="#e11d48"><button id="thin" class="tool">−</button><button id="thick" class="tool">＋</button><button id="undo" class="tool">↶</button><button id="redo" class="tool">↷</button><button id="fit" class="tool">맞춤</button></div>
    </div>
    <div id="stage" class="stage"><div id="stageInner" class="stageInner"><div id="empty" class="empty"><div style="font-size:44px">✍️</div><h1>Apple Pencil로 바로 필기하세요</h1><p>Pencil은 필기 전용, 손가락 한 개는 이동, 두 손가락은 확대·축소. 좌우 가장자리를 짧게 탭하면 페이지가 넘어갑니다.</p><label class="btn primary">PDF 선택<input id="emptyPdf" type="file" accept="application/pdf" hidden></label></div><div id="pageWrap" class="pagewrap hidden"><canvas id="pdfCanvas" class="pdf"></canvas><canvas id="inkCanvas" class="ink"></canvas><div class="edgeHint left"></div><div class="edgeHint right"></div><div id="pinLayer" class="pinlayer"></div></div></div></div>
    <div class="filebar"><div id="filename" class="file"></div></div>
  </section>
  <aside class="notes">
    <div class="nhead"><div><small style="color:#6b7280;font-weight:800">PAGE NOTE</small><h2><span id="pLabel">1</span>p.</h2></div></div>
    <div class="noteSplit">
      <section class="notePane transcriptPane">
        <div class="paneHead">
          <div><b>📄 .md / 전사문</b><small id="mdFilename">페이지별 전사문 · 수정 가능</small></div>
          <div class="paneActions"><label class="btn mdload">MD 불러오기<input id="mdInput" type="file" accept=".md,text/markdown,text/plain" hidden></label><div class="mdmode"><button id="mdModeRendered" class="tool active" type="button">결과 편집</button><button id="mdModeRaw" class="tool" type="button">원문</button></div><div class="mdformat"><button id="mdBold" class="tool fmt-bold" type="button" title="선택 영역 굵게"><b>B</b></button><button id="mdExam" class="tool fmt-exam" type="button" title="선택 영역 시험강조">시험</button><button id="mdHighlight" class="tool fmt-highlight" type="button" title="선택 영역 하이라이트">형광</button></div><button id="mic" class="btn micbtn">🎤 시작</button></div>
        </div>
        <div class="mdEditorStack">
          <div id="mdRendered" class="mdRendered markdown-body" contenteditable="true" spellcheck="false" data-placeholder="MD를 불러오면 실제 출력 형태로 보면서 바로 수정할 수 있습니다."></div>
          <textarea id="transcript" class="transcript mdRaw hidden" placeholder="<<<PAGE n>>> 형식의 .md 파일을 불러오거나 직접 수정하세요. 음성 전사도 이 칸에 추가됩니다."></textarea>
        </div>
        <div class="meta"><span id="transcriptChars">0자</span><span>전사문 자동저장</span></div>
      </section>
      <section class="notePane classNotePane">
        <div class="paneHead"><div><b>✍️ 수업 필기</b><small>기존 Page Note 그대로 유지</small></div></div>
        <div class="tags"><button class="tag exam" data-tag="[시험] ">시험</button><button class="tag important" data-tag="[중요] ">중요</button><button class="tag prof" data-tag="[교수설명] ">교수설명</button><button class="tag question" data-tag="[질문] ">질문</button><button id="time" class="tag">시간</button></div>
        <textarea id="editor" class="editor" placeholder="이 페이지의 수업 필기를 입력하세요."></textarea>
        <div class="meta"><span id="chars">0자</span><span>수업 필기 자동저장</span></div>
      </section>
    </div>
    <div class="pinsbox"><b>📌 이 페이지 코멘트 핀</b><div id="pinList" class="pinlist"></div></div>
    <div class="exports"><button id="docx">Word<br><small>A4 4쪽 배치</small></button><button id="printBtn">PDF<br><small>A4 4쪽 배치</small></button><button id="md">Markdown<br><small>전사문+수업 필기</small></button><button id="json">JSON<br><small>전체 백업</small></button></div>
  </aside>
</main>
<div id="pinPopover" class="pinpopover hidden"><textarea id="pinText" placeholder="이 위치에 짧은 코멘트"></textarea><div class="pinactions"><button id="pinCancel" class="tool">취소</button><button id="pinSave" class="btn primary">저장</button></div></div>
<div id="toast" class="toast"></div><section id="printArea" class="print"></section>
<script type="module" src="./app.js"></script>
</body>
</html>
