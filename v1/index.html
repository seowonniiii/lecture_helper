<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Lecture Helper V1</title>
<style>
:root{--bg:#eef1f5;--surface:#fff;--muted:#6b7280;--border:#dfe3e8;--text:#111827;--danger:#b91c1c;--warn:#a16207;--blue:#1d4ed8;--green:#047857}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--text);background:var(--bg)}button,input,textarea{font:inherit}button,label{cursor:pointer}.hidden{display:none!important}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:max(8px,env(safe-area-inset-top)) 14px 8px;background:#fffffff2;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;backdrop-filter:blur(16px)}.brand{display:flex;gap:9px;align-items:center}.logo{width:34px;height:34px;border-radius:10px;background:#111827;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}.brand b{display:block;font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.actions{display:flex;gap:7px}.btn{border:1px solid var(--border);border-radius:10px;min-height:40px;padding:0 13px;background:#fff;color:var(--text);display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:#111827;color:#fff;border-color:#111827;font-weight:700}.shell{height:calc(100vh - 62px);display:grid;grid-template-columns:minmax(0,1fr) 370px}.viewer{display:grid;grid-template-rows:52px minmax(0,1fr) 52px;min-width:0;background:#d9dde3}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#f8f9fa;border-bottom:1px solid var(--border);gap:12px}.title{border:0;background:transparent;font-weight:750;outline:none;min-width:0;width:min(520px,48vw)}.file{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.titlebox{min-width:0}.pdfstage{overflow:auto;padding:22px;display:flex;align-items:flex-start;justify-content:center;position:relative}.empty{margin:auto;background:#fffffff2;border:1px solid var(--border);border-radius:20px;padding:36px;text-align:center;max-width:520px}.empty h1{font-size:22px;margin:8px 0}.empty p{color:var(--muted);line-height:1.5}#pdfCanvas{background:#fff;box-shadow:0 14px 40px #1118271a;display:block}.nav{background:#fffffff0;border-top:1px solid var(--border);display:flex;justify-content:center;align-items:center;gap:14px;padding-bottom:env(safe-area-inset-bottom)}.nav input{width:58px;height:34px;border:1px solid var(--border);border-radius:8px;text-align:center}.notes{background:#fff;border-left:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}.nhead{display:flex;align-items:center;justify-content:space-between}.nhead h2{margin:0}.tagrow{display:flex;flex-wrap:wrap;gap:6px}.tag{min-height:30px;border-radius:999px;border:1px solid var(--border);background:#fff;padding:0 9px;font-size:11px;font-weight:700}.exam{color:var(--danger);background:#fff5f5;border-color:#fecaca}.important{color:var(--warn);background:#fffbeb;border-color:#fde68a}.prof{color:var(--blue);background:#eff6ff;border-color:#bfdbfe}.question{color:var(--green);background:#ecfdf5;border-color:#a7f3d0}.editor{flex:1;min-height:280px;width:100%;resize:none;border:1px solid var(--border);border-radius:14px;background:#f7f8fa;padding:13px;outline:none;line-height:1.6}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.exports{border-top:1px solid var(--border);padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.exports button{min-height:52px;border:1px solid var(--border);border-radius:10px;background:#fff;font-weight:700}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 13px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.print{display:none}.mic.on{background:#fee2e2}@media(max-width:820px){.shell{height:auto;min-height:calc(100vh - 62px);grid-template-columns:1fr;grid-template-rows:minmax(56vh,1fr) auto}.viewer{min-height:58vh}.notes{border-left:0;border-top:1px solid var(--border);min-height:430px}.title{width:45vw}}@media(max-width:560px){.brand small{display:none}.actions .backup{display:none}.pdfstage{padding:10px}.notes{padding:13px}.toolbar .zoom{display:none}}@media print{@page{size:A4 portrait;margin:12mm}body>*:not(#printArea){display:none!important}#printArea{display:block!important}.pp{break-after:page}.pp img{width:100%;max-height:72vh;object-fit:contain}.pnote{white-space:pre-wrap;line-height:1.55}}

/* UX patch: top page navigation, bottom filename, switchable notes panel */
.viewer{display:flex!important;flex-direction:column!important;min-width:0}
.viewer>.toolbar{flex:0 0 auto}.viewer>.pdfstage,.viewer>.stage{flex:1 1 auto;min-height:0}.viewer>.filebar{flex:0 0 auto}
.toolbar .nav{order:-20;flex:0 0 100%;width:100%;border:0!important;background:transparent!important;padding:0!important;min-height:38px}
.filebar{min-height:28px;padding:6px 12px;background:#f8f9fa;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.filebar .file{max-width:92vw;text-align:center}
.layout-toggle{white-space:nowrap}
.shell.notes-bottom{height:auto!important;min-height:calc(100vh - 62px);grid-template-columns:1fr!important;grid-template-rows:minmax(62vh,1fr) auto!important}
.shell.notes-bottom .notes{border-left:0!important;border-top:1px solid var(--border)!important;min-height:340px;max-height:none}
.shell.notes-bottom .viewer{min-height:62vh}
@media(max-width:900px){.layout-toggle{display:inline-flex}.shell.notes-bottom{grid-template-rows:minmax(58vh,1fr) auto!important}}

</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">LH</div><div><b>Lecture Helper <span style="color:#6b7280">V1</span></b><small id="status">PDF를 열어주세요</small></div></div><div class="actions"><label class="btn primary">PDF 열기<input id="pdfInput" type="file" accept="application/pdf" hidden></label><label class="btn backup">백업 복원<input id="backupInput" type="file" accept="application/json" hidden></label></div></header>
<main class="shell"><section class="viewer"><div class="toolbar"><div class="titlebox"><input id="title" class="title" placeholder="강의 제목"><div id="filename" class="file"></div></div><div class="zoom"><button id="zoomOut" class="btn">−</button><button id="fit" class="btn">맞춤</button><button id="zoomIn" class="btn">＋</button></div></div><div id="stage" class="pdfstage"><div id="empty" class="empty"><div style="font-size:44px">📄</div><h1>강의 PDF를 열어주세요</h1><p>각 페이지의 코멘트가 자동 저장되고 수업 후 Word·PDF·Markdown·JSON으로 내보낼 수 있어요.</p><label class="btn primary">PDF 선택<input id="emptyPdf" type="file" accept="application/pdf" hidden></label></div><canvas id="pdfCanvas" class="hidden"></canvas></div><div class="nav"><button id="prev" class="btn">‹ 이전</button><input id="page" type="number" min="1" value="1"><span>/ <b id="total">0</b></span><button id="next" class="btn">다음 ›</button></div></section><aside class="notes"><div class="nhead"><div><small style="color:#6b7280;font-weight:800">PAGE NOTE</small><h2><span id="pLabel">1</span>p.</h2></div><button id="mic" class="btn mic">🎤</button></div><div class="tagrow"><button class="tag exam" data-tag="[시험] ">시험</button><button class="tag important" data-tag="[중요] ">중요</button><button class="tag prof" data-tag="[교수설명] ">교수설명</button><button class="tag question" data-tag="[질문] ">질문</button><button id="time" class="tag">시간</button></div><textarea id="editor" class="editor" placeholder="이 페이지에 대한 코멘트를 입력하세요.\n\n예)\n[시험] 이 기준 꼭 출제\n[교수설명] 슬라이드에는 없지만 중요"></textarea><div class="meta"><span id="chars">0자</span><span>입력 즉시 자동저장</span></div><div class="exports"><button id="docx">Word<br><small>.docx</small></button><button id="printBtn">PDF<br><small>인쇄 저장</small></button><button id="md">Markdown<br><small>AI 전달용</small></button><button id="json">JSON<br><small>전체 백업</small></button></div></aside></main>
<div id="toast" class="toast"></div><section id="printArea" class="print"></section>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs';
import {Document,Packer,Paragraph,TextRun,HeadingLevel,ImageRun,PageBreak,AlignmentType} from 'https://cdn.jsdelivr.net/npm/docx@9.8.1/+esm';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.min.mjs';
const $=id=>document.getElementById(id), E={pdfInput:$('pdfInput'),emptyPdf:$('emptyPdf'),backupInput:$('backupInput'),status:$('status'),title:$('title'),filename:$('filename'),stage:$('stage'),empty:$('empty'),canvas:$('pdfCanvas'),page:$('page'),total:$('total'),pLabel:$('pLabel'),prev:$('prev'),next:$('next'),zoomOut:$('zoomOut'),zoomIn:$('zoomIn'),fit:$('fit'),editor:$('editor'),chars:$('chars'),time:$('time'),mic:$('mic'),docx:$('docx'),printBtn:$('printBtn'),md:$('md'),json:$('json'),toast:$('toast'),printArea:$('printArea')};
let db,pdfDoc=null,project=null,currentPage=1,scale=1.15,fit=true,renderTask=null,saveTimer=null,recognition=null,listening=false;
const DB='lecture-helper-v1',PS='projects',NS='notes',LAST='lh-v1-last';
function toast(t){E.toast.textContent=t;E.toast.classList.add('show');setTimeout(()=>E.toast.classList.remove('show'),1400)}
function time(){return new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
function safe(n){return(n||'lecture').replace(/[\\/:*?"<>|]/g,'_').trim()||'lecture'}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function done(tx){return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
async function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(PS))d.createObjectStore(PS,{keyPath:'id'});if(!d.objectStoreNames.contains(NS)){const s=d.createObjectStore(NS,{keyPath:'key'});s.createIndex('projectId','projectId')}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putP(p){const tx=db.transaction(PS,'readwrite');tx.objectStore(PS).put(p);await done(tx)}
async function getP(id){const tx=db.transaction(PS);const x=await req(tx.objectStore(PS).get(id));await done(tx);return x}
async function putN(page,text){const tx=db.transaction(NS,'readwrite');tx.objectStore(NS).put({key:`${project.id}:${page}`,projectId:project.id,page,text,updatedAt:Date.now()});await done(tx)}
async function getN(page){const tx=db.transaction(NS);const x=await req(tx.objectStore(NS).get(`${project.id}:${page}`));await done(tx);return x?.text||''}
async function allN(){const tx=db.transaction(NS);const x=await req(tx.objectStore(NS).index('projectId').getAll(IDBKeyRange.only(project.id)));await done(tx);return x.sort((a,b)=>a.page-b.page)}
function idFor(f){return`${f.name}::${f.size}::${f.lastModified}`}
async function openFile(f){if(!f)return;const id=idFor(f);project=await getP(id)||{id,filename:f.name,title:f.name.replace(/\.pdf$/i,''),pdfBlob:f,lastPage:1,createdAt:Date.now()};project.pdfBlob=f;project.updatedAt=Date.now();await putP(project);localStorage.setItem(LAST,id);await loadProject(project)}
async function loadProject(p){project=p;E.status.textContent='PDF 여는 중…';const data=await p.pdfBlob.arrayBuffer();pdfDoc=await pdfjsLib.getDocument({data}).promise;project.pageCount=pdfDoc.numPages;currentPage=Math.min(Math.max(project.lastPage||1,1),pdfDoc.numPages);E.total.textContent=pdfDoc.numPages;E.page.max=pdfDoc.numPages;E.title.value=project.title||project.filename.replace(/\.pdf$/i,'');E.filename.textContent=project.filename;E.empty.classList.add('hidden');E.canvas.classList.remove('hidden');await go(currentPage);E.status.textContent='자동저장 켜짐';await putP(project)}
async function render(){if(!pdfDoc)return;if(renderTask){try{renderTask.cancel()}catch{}}const pg=await pdfDoc.getPage(currentPage),b=pg.getViewport({scale:1});let s=scale;if(fit){const w=Math.max(280,E.stage.clientWidth-36);s=Math.min(2.4,Math.max(.35,w/b.width));scale=s}const dpr=Math.min(devicePixelRatio||1,2),v=pg.getViewport({scale:s*dpr});E.canvas.width=v.width;E.canvas.height=v.height;E.canvas.style.width=`${v.width/dpr}px`;E.canvas.style.height=`${v.height/dpr}px`;const ctx=E.canvas.getContext('2d',{alpha:false});renderTask=pg.render({canvasContext:ctx,viewport:v});try{await renderTask.promise}catch(e){if(e?.name!=='RenderingCancelledException')throw e}renderTask=null}
async function go(n){if(!pdfDoc)return;currentPage=Math.min(Math.max(+n||1,1),pdfDoc.numPages);E.page.value=currentPage;E.pLabel.textContent=currentPage;await Promise.all([render(),loadNote()]);E.stage.scrollTop=0;project.lastPage=currentPage;project.updatedAt=Date.now();putP(project)}
async function loadNote(){E.editor.value=await getN(currentPage);E.chars.textContent=`${E.editor.value.length}자`}
function saveNote(){if(!project)return;clearTimeout(saveTimer);E.chars.textContent=`${E.editor.value.length}자`;E.status.textContent='저장 중…';saveTimer=setTimeout(async()=>{await putN(currentPage,E.editor.value);project.updatedAt=Date.now();await putP(project);E.status.textContent=`저장됨 · ${time()}`},220)}
function insert(t){const a=E.editor.selectionStart,b=E.editor.selectionEnd,v=E.editor.value;const pre=v.slice(0,a),post=v.slice(b),sep=pre&&!pre.endsWith('\n')?'\n':'';E.editor.value=pre+sep+t+post;const p=(pre+sep+t).length;E.editor.setSelectionRange(p,p);E.editor.focus();saveNote()}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function snap(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await putN(currentPage,E.editor.value)}return allN()}
function markdown(notes){const lines=[`# ${project.title||project.filename}`,'',`- 원본 PDF: ${project.filename}`,`- 총 페이지: ${project.pageCount}`,''];for(const n of notes){if(!n.text.trim())continue;lines.push(`<<<PAGE ${n.page}>>>`,'',`${n.page}p.`,'',n.text.trim(),'')}return lines.join('\n')}
async function renderJpg(n,max=1150){const pg=await pdfDoc.getPage(n),b=pg.getViewport({scale:1}),s=Math.min(2,max/b.width),v=pg.getViewport({scale:s}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:v}).promise;const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));return{blob,w:c.width,h:c.height}}
E.docx.onclick=async()=>{if(!project)return;const ns=(await snap()).filter(n=>n.text.trim());if(!ns.length)return alert('저장된 코멘트가 없습니다.');toast('Word 만드는 중…');const children=[new Paragraph({text:project.title,heading:HeadingLevel.TITLE,alignment:AlignmentType.CENTER}),new Paragraph({children:[new TextRun({text:`원본 PDF: ${project.filename}`,color:'666666'})]})];for(const n of ns){children.push(new Paragraph({children:[new PageBreak()]}),new Paragraph({text:`${n.page}p.`,heading:HeadingLevel.HEADING_1}));const im=await renderJpg(n.page);const w=560,h=Math.round(w*im.h/im.w);children.push(new Paragraph({alignment:AlignmentType.CENTER,children:[new ImageRun({data:new Uint8Array(await im.blob.arrayBuffer()),transformation:{width:w,height:h},type:'jpg'})]}),new Paragraph({text:'수업 중 코멘트',heading:HeadingLevel.HEADING_2}));for(const line of n.text.split(/\r?\n/))children.push(new Paragraph({children:[new TextRun({text:line||' '})]}))}const blob=await Packer.toBlob(new Document({sections:[{children}]}));download(blob,`${safe(project.title)}_lecture-comments.docx`);toast('Word 저장 완료')};
E.md.onclick=async()=>download(new Blob([markdown(await snap())],{type:'text/markdown;charset=utf-8'}),`${safe(project.title)}_lecture-comments.md`);
E.json.onclick=async()=>{const ns=await snap(),payload={app:'Lecture Helper',version:1,exportedAt:new Date().toISOString(),project:{filename:project.filename,title:project.title,pageCount:project.pageCount,lastPage:currentPage},notes:ns.map(({page,text,updatedAt})=>({page,text,updatedAt}))};download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),`${safe(project.title)}_backup.json`)};
E.printBtn.onclick=async()=>{const ns=(await snap()).filter(n=>n.text.trim());if(!ns.length)return alert('저장된 코멘트가 없습니다.');E.printArea.innerHTML='';toast('PDF 인쇄본 준비 중…');for(const n of ns){const im=await renderJpg(n.page,1400),u=URL.createObjectURL(im.blob),sec=document.createElement('article');sec.className='pp';sec.innerHTML=`<h1>${project.title} · ${n.page}p.</h1><img src="${u}"><h2>수업 중 코멘트</h2><div class="pnote"></div>`;sec.querySelector('.pnote').textContent=n.text;E.printArea.appendChild(sec)}setTimeout(()=>window.print(),100)};
E.backupInput.onchange=async e=>{if(!project)return alert('같은 PDF를 먼저 열어주세요.');try{const d=JSON.parse(await e.target.files[0].text());if(d.project.pageCount!==project.pageCount)return alert('페이지 수가 다른 백업입니다.');for(const n of d.notes||[])await putN(n.page,String(n.text||''));await loadNote();toast('백업 복원 완료')}catch{alert('올바른 백업 파일이 아닙니다.')}};
E.pdfInput.onchange=e=>openFile(e.target.files[0]);E.emptyPdf.onchange=e=>openFile(e.target.files[0]);E.editor.addEventListener('input',saveNote);E.prev.onclick=()=>go(currentPage-1);E.next.onclick=()=>go(currentPage+1);E.page.onchange=()=>go(E.page.value);E.zoomIn.onclick=()=>{fit=false;scale=Math.min(3,scale+.15);render()};E.zoomOut.onclick=()=>{fit=false;scale=Math.max(.35,scale-.15);render()};E.fit.onclick=()=>{fit=true;render()};E.time.onclick=()=>insert(`[${time()}] `);document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>insert(b.dataset.tag));E.title.addEventListener('input',()=>{if(!project)return;project.title=E.title.value;clearTimeout(window._tt);window._tt=setTimeout(()=>putP(project),300)});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=false;recognition.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';insert(s)};recognition.onend=()=>{listening=false;E.mic.classList.remove('on')};E.mic.onclick=()=>{if(listening){recognition.stop();return}try{recognition.start();listening=true;E.mic.classList.add('on')}catch{}}}else E.mic.onclick=()=>alert('이 브라우저에서는 음성 입력을 지원하지 않습니다.');
window.addEventListener('resize',()=>{if(pdfDoc&&fit)render()});db=await openDb();const last=localStorage.getItem(LAST);if(last){const p=await getP(last);if(p?.pdfBlob)loadProject(p).catch(console.error)}

// UX patch V1
{
  const shell=document.querySelector('.shell');
  const viewer=document.querySelector('.viewer');
  const toolbar=document.querySelector('.toolbar');
  const nav=document.querySelector('.nav');
  if(toolbar&&nav&&!toolbar.contains(nav)) toolbar.prepend(nav);
  if(viewer&&E.filename&&!document.querySelector('.filebar')){
    const filebar=document.createElement('div');
    filebar.className='filebar';
    filebar.appendChild(E.filename);
    viewer.appendChild(filebar);
  }
  const layoutKey='lecture-helper-v1-notes-layout';
  const layoutBtn=document.createElement('button');
  layoutBtn.type='button';
  layoutBtn.className='btn layout-toggle';
  const applyLayout=()=>{
    const bottom=localStorage.getItem(layoutKey)==='bottom';
    shell?.classList.toggle('notes-bottom',bottom);
    layoutBtn.textContent=bottom?'▥ 코멘트 오른쪽':'▤ 코멘트 하단';
  };
  layoutBtn.onclick=()=>{
    localStorage.setItem(layoutKey,shell?.classList.contains('notes-bottom')?'right':'bottom');
    applyLayout();
    if(pdfDoc){fit=true;render();}
  };
  toolbar?.appendChild(layoutBtn);
  applyLayout();
}


// V1 edge tap navigation
let v1EdgeStart=null;
E.canvas.addEventListener('pointerdown',ev=>{
  const r=E.canvas.getBoundingClientRect();
  v1EdgeStart={x:ev.clientX,y:ev.clientY,t:Date.now(),rx:(ev.clientX-r.left)/r.width};
});
E.canvas.addEventListener('pointerup',ev=>{
  if(!v1EdgeStart||!pdfDoc)return;
  const d=Math.hypot(ev.clientX-v1EdgeStart.x,ev.clientY-v1EdgeStart.y),dt=Date.now()-v1EdgeStart.t,x=v1EdgeStart.rx;
  v1EdgeStart=null;
  if(d>14||dt>550)return;
  if(x<.18)go(currentPage-1);else if(x>.82)go(currentPage+1);
});

</script>
</body></html>
