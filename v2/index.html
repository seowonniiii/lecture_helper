<header class="top"><div class="brand"><div class="logo">LH</div><div><b>Lecture Helper <span style="color:#047857">V2</span></b><small id="status">PDF를 열어주세요</small></div></div><div class="actions"><label class="btn primary">PDF 열기<input id="pdfInput" type="file" accept="application/pdf" hidden></label><label class="btn backup">백업 복원<input id="backupInput" type="file" accept="application/json" hidden></label></div></header>
<main class="shell"><section class="viewer"><div class="toolbar"><div class="titlebox"><input id="title" class="title" placeholder="강의 제목"><div id="filename" class="file"></div></div><div class="toolrow"><button class="tool active" data-tool="pen">✏️ 펜</button><button class="tool" data-tool="highlight">🖍 형광펜</button><button class="tool" data-tool="erase">⌫ 지우개</button><button class="tool" data-tool="pin">📌 핀</button><input id="inkColor" class="color" type="color" value="#e11d48"><button id="undo" class="tool">↶</button><button id="redo" class="tool">↷</button><button id="fit" class="tool">맞춤</button></div></div><div id="stage" class="stage"><div id="empty" class="empty"><div style="font-size:44px">✍️</div><h1>PDF 위에 바로 필기하세요</h1><p>Apple Pencil로 필기하고, 손가락은 스크롤 및 좌우 가장자리 탭으로 페이지 이동에 사용해요.</p><label class="btn primary">PDF 선택<input id="emptyPdf" type="file" accept="application/pdf" hidden></label></div><div id="pageWrap" class="pagewrap hidden"><canvas id="pdfCanvas" class="pdf"></canvas><canvas id="inkCanvas" class="ink"></canvas><div id="pinLayer" class="pinlayer"></div></div></div><div class="nav"><button id="prev" class="btn">‹ 이전</button><input id="page" type="number" min="1" value="1"><span>/ <b id="total">0</b></span><button id="next" class="btn">다음 ›</button></div></section><aside class="notes"><div class="nhead"><div><small style="color:#6b7280;font-weight:800">PAGE NOTE</small><h2><span id="pLabel">1</span>p.</h2></div><button id="mic" class="btn">🎤</button></div><div class="tags"><button class="tag exam" data-tag="[시험] ">시험</button><button class="tag important" data-tag="[중요] ">중요</button><button class="tag prof" data-tag="[교수설명] ">교수설명</button><button class="tag question" data-tag="[질문] ">질문</button><button id="time" class="tag">시간</button></div><textarea id="editor" class="editor" placeholder="이 페이지에 대한 코멘트를 입력하세요."></textarea><div class="meta"><span id="chars">0자</span><span>텍스트·필기 자동저장</span></div><div class="pinsbox"><b>📌 이 페이지 코멘트 핀</b><div id="pinLis const $=id=>document.getElementById(id),E={pdfInput:$('pdfInput'),emptyPdf:$('emptyPdf'),backupInput:$('backupInput'),status:$('status'),title:$('title'),filename:$('filename'),stage:$('stage'),empty:$('empty'),pageWrap:$('pageWrap'),pdfCanvas:$('pdfCanvas'),inkCanvas:$('inkCanvas'),pinLayer:$('pinLayer'),page:$('page'),total:$('total'),pLabel:$('pLabel'),prev:$('prev'),next:$('next'),fit:$('fit'),inkColor:$('inkColor'),undo:$('undo'),redo:$('redo'),editor:$('editor'),chars:$('chars'),time:$('time'),mic:$('mic'),pinList:$('pinList'),docx:$('docx'),printBtn:$('printBtn'),md:$('md'),json:$('json'),toast:$('toast'),printArea:$('printArea')};
let db,pdfDoc=null,project=null,currentPage=1,scale=1.15,fit=true,renderTask=null,tool='pen',drawing=false,currentStroke=null,pageData={strokes:[],redo:[],pins:[]},saveTimer=null,recognition=null,listening=false;
const DB='lecture-helper-v2',PS='projects',NS='notes',AS='annotations',LAST='lh-v2-last';
function toast(t){E.toast.textContent=t;E.toast.classList.add('show');setTimeout(()=>E.toast.classList.remove('show'),1400)}
function time(){return new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
function safe(n){return(n||'lecture').replace(/[\\/:*?"<>|]/g,'_').trim()||'lecture'}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function done(tx){return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
async function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(PS))d.createObjectStore(PS,{keyPath:'id'});if(!d.objectStoreNames.contains(NS)){const s=d.createObjectStore(NS,{keyPath:'key'});s.createIndex('projectId','projectId')}if(!d.objectStoreNames.contains(AS)){const s=d.createObjectStore(AS,{keyPath:'key'});s.createIndex('projectId','projectId')}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function put(store,obj){const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(obj);await done(tx)}
async function get(store,key){const tx=db.transaction(store);const x=await req(tx.objectStore(store).get(key));await done(tx);return x}
async function getByProject(store,id){const tx=db.transaction(store);const x=await req(tx.objectStore(store).index('projectId').getAll(IDBKeyRange.only(id)));await done(tx);return x.sort((a,b)=>a.page-b.page)}
function idFor(f){return`${f.name}::${f.size}::${f.lastModified}`}
async function openFile(f){if(!f)return;const id=idFor(f);project=await get(PS,id)||{id,filename:f.name,title:f.name.replace(/\.pdf$/i,''),pdfBlob:f,lastPage:1,createdAt:Date.now()};project.pdfBlob=f;project.updatedAt=Date.now();await put(PS,project);localStorage.setItem(LAST,id);await loadProject(project)}
async function loadProject(p){project=p;E.status.textContent='PDF 여는 중…';pdfDoc=await pdfjsLib.getDocument({data:await p.pdfBlob.arrayBuffer()}).promise;project.pageCount=pdfDoc.numPages;currentPage=Math.min(Math.max(project.lastPage||1,1),pdfDoc.numPages);E.total.textContent=pdfDoc.numPages;E.page.max=pdfDoc.numPages;E.title.value=project.title||project.filename.replace(/\.pdf$/i,'');E.filename.textContent=project.filename;E.empty.classList.add('hidden');E.pageWrap.classList.remove('hidden');await go(currentPage);E.status.textContent='자동저장 켜짐';await put(PS,project)}
async function renderPdf(){if(!pdfDoc)return;if(renderTask){try{renderTask.cancel()}catch{}}const pg=await pdfDoc.getPage(currentPage),b=pg.getViewport({scale:1});if(fit){const w=Math.max(280,E.stage.clientWidth-36);scale=Math.min(2.3,Math.max(.35,w/b.width))}const dpr=Math.min(devicePixelRatio||1,2),v=pg.getViewport({scale:scale*dpr});E.pdfCanvas.width=v.width;E.pdfCanvas.height=v.height;E.pdfCanvas.style.width=`${v.width/dpr}px`;E.pdfCanvas.style.height=`${v.height/dpr}px`;E.inkCanvas.width=v.width;E.inkCanvas.height=v.height;E.inkCanvas.style.width=`${v.width/dpr}px`;E.inkCanvas.style.height=`${v.height/dpr}px`;E.pageWrap.style.width=`${v.width/dpr}px`;E.pageWrap.style.height=`${v.height/dpr}px`;const ctx=E.pdfCanvas.getContext('2d',{alpha:false});renderTask=pg.render({canvasContext:ctx,viewport:v});try{await renderTask.promise}catch(e){if(e?.name!=='RenderingCancelledException')throw e}renderTask=null;redrawInk();renderPins()}
async function loadPageData(){const a=await get(AS,`${project.id}:${currentPage}`);pageData=a?{strokes:a.strokes||[],redo:[],pins:a.pins||[]}:{strokes:[],redo:[],pins:[]};E.editor.value=(await get(NS,`${project.id}:${currentPage}`))?.text||'';E.chars.textContent=`${E.editor.value.length}자`;renderPins();renderPinList()}
async function savePageData(){if(!project)return;await put(AS,{key:`${project.id}:${currentPage}`,projectId:project.id,page:currentPage,strokes:pageData.strokes,pins:pageData.pins,updatedAt:Date.now()})}
async function saveNoteNow(){if(!project)return;await put(NS,{key:`${project.id}:${currentPage}`,projectId:project.id,page:currentPage,text:E.editor.value,updatedAt:Date.now()});E.status.textContent=`저장됨 · ${time()}`}
function queueNote(){E.chars.textContent=`${E.editor.value.length}자`;clearTimeout(saveTimer);E.status.textContent='저장 중…';saveTimer=setTimeout(saveNoteNow,220)}
async function go(n){if(!pdfDoc)return;if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await saveNoteNow()}currentPage=Math.min(Math.max(+n||1,1),pdfDoc.numPages);E.page.value=currentPage;E.pLabel.textContent=currentPage;await loadPageData();await renderPdf();E.stage.scrollTop=0;project.lastPage=currentPage;project.updatedAt=Date.now();put(PS,project)}
function normPos(ev){const r=E.inkCanvas.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width,y:(ev.clientY-r.top)/r.height}}
function drawStroke(ctx,s,w,h){if(!s.points?.length)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.points[0].x*w,s.points[0].y*h);for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x*w,s.points[i].y*h);if(s.tool==='erase'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='rgba(0,0,0,1)';ctx.lineWidth=(s.width||18)*devicePixelRatio}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=s.color||'#e11d48';ctx.globalAlpha=s.tool==='highlight'?.25:1;ctx.lineWidth=(s.width||(s.tool==='highlight'?18:2.4))*devicePixelRatio}ctx.stroke();ctx.restore()}
function redrawInk(){const c=E.inkCanvas,ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);for(const s of pageData.strokes)drawStroke(ctx,s,c.width,c.height)}

function renderPinList(){E.pinList.innerHTML='';if(!pageData.pins.length){E.pinList.innerHTML='<div style="color:#6b7280;font-size:11px">아직 핀이 없습니다.</div>';return}pageData.pins.forEach((p,i)=>{const d=document.createElement('div');d.className='pitem';const span=document.createElement('span');span.textContent=p.text;const x=document.createElement('button');x.textContent='삭제';x.onclick=async()=>{pageData.pins.splice(i,1);await savePageData();renderPins();renderPinList()};d.append(span,x);E.pinList.append(d)})}

function insert(t){const a=E.editor.selectionStart,b=E.editor.selectionEnd,v=E.editor.value,pre=v.slice(0,a),post=v.slice(b),sep=pre&&!pre.endsWith('\n')?'\n':'';E.editor.value=pre+sep+t+post;const p=(pre+sep+t).length;E.editor.setSelectionRange(p,p);E.editor.focus();queueNote()}

function markdown(data){const nm=new Map(data.notes.map(n=>[n.page,n.text||''])),am=new Map(data.ann.map(a=>[a.page,a]));const lines=[`# ${project.title||project.filename}`,'',`- 원본 PDF: ${project.filename}`,`- 총 페이지: ${project.pageCount}`,''];for(let p=1;p<=project.pageCount;p++){const note=nm.get(p)||'',a=am.get(p),pins=a?.pins||[];if(!note.trim()&&!pins.length)continue;lines.push(`<<<PAGE ${p}>>>`,'',`${p}p.`,'');if(note.trim())lines.push(note.trim(),'');if(pins.length){lines.push('### 위치 코멘트');pins.forEach((x,i)=>lines.push(`- [PIN ${i+1}] ${x.text}`));lines.push('')}}return lines.join('\n')}
async function annotatedJpg(pageNum,max=1200){const pg=await pdfDoc.getPage(pageNum),b=pg.getViewport({scale:1}),s=Math.min(2,max/b.width),v=pg.getViewport({scale:s}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;const ctx=c.getContext('2d',{alpha:false});await pg.render({canvasContext:ctx,viewport:v}).promise;const a=await get(AS,`${project.id}:${pageNum}`);for(const st of a?.strokes||[])drawStroke(ctx,st,c.width,c.height);for(const p of a?.pins||[]){ctx.save();ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(p.x*c.width,p.y*c.height,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',p.x*c.width,p.y*c.height);ctx.restore()}const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return{blob,w:c.width,h:c.height}}
E.docx.onclick=async()=>{if(!project)return;const data=await snapAll(),nm=new Map(data.notes.map(n=>[n.page,n.text||''])),am=new Map(data.ann.map(a=>[a.page,a]));const pages=[];for(let p=1;p<=project.pageCount;p++){const a=am.get(p),note=nm.get(p)||'';if(note.trim()||(a?.strokes?.length)||(a?.pins?.length))pages.push(p)}if(!pages.length)return alert('저장된 내용이 없습니다.');toast('Word 만드는 중…');const children=[new Paragraph({text:project.title,heading:HeadingLevel.TITLE,alignment:AlignmentType.CENTER}),new Paragraph({children:[new TextRun({text:`원본 PDF: ${project.filename}`,color:'666666'})]})];for(const p of pages){children.push(new Paragraph({children:[new PageBreak()]}),new Paragraph({text:`${p}p.`,heading:HeadingLevel.HEADING_1}));const im=await annotatedJpg(p);const w=560,h=Math.round(w*im.h/im.w);children.push(new Paragraph({alignment:AlignmentType.CENTER,children:[new ImageRun({data:new Uint8Array(await im.blob.arrayBuffer()),transformation:{width:w,height:h},type:'jpg'})]}));const note=nm.get(p)||'';if(note.trim()){children.push(new Paragraph({text:'수업 중 코멘트',heading:HeadingLevel.HEADING_2}));for(const line of note.split(/\r?\n/))children.push(new Paragraph({children:[new TextRun({text:line||' '})]}))}const pins=am.get(p)?.pins||[];if(pins.length){children.push(new Paragraph({text:'위치 코멘트',heading:HeadingLevel.HEADING_2}));pins.forEach((x,i)=>children.push(new Paragraph({text:`PIN ${i+1}. ${x.text}`})))}}const blob=await Packer.toBlob(new Document({sections:[{children}]}));download(blob,`${safe(project.title)}_annotated.docx`);toast('Word 저장 완료')};
E.md.onclick=async()=>download(new Blob([markdown(await snapAll())],{type:'text/markdown;charset=utf-8'}),`${safe(project.title)}_lecture-comments.md`);
E.json.onclick=async()=>{const data=await snapAll(),payload={app:'Lecture Helper',version:2,exportedAt:new Date().toISOString(),project:{filename:project.filename,title:project.title,pageCount:project.pageCount,lastPage:currentPage},notes:data.notes.map(({page,text,updatedAt})=>({page,text,updatedAt})),annotations:data.ann.map(({page,strokes,pins,updatedAt})=>({page,strokes,pins,updatedAt}))};download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),`${safe(project.title)}_backup_v2.json`)};
E.printBtn.onclick=async()=>{const data=await snapAll(),nm=new Map(data.notes.map(n=>[n.page,n.text||''])),am=new Map(data.ann.map(a=>[a.page,a]));const pages=[];for(let p=1;p<=project.pageCount;p++){const a=am.get(p),note=nm.get(p)||'';if(note.trim()||(a?.strokes?.length)||(a?.pins?.length))pages.push(p)}if(!pages.length)return alert('저장된 내용이 없습니다.');E.printArea.innerHTML='';toast('PDF 인쇄본 준비 중…');for(const p of pages){const im=await annotatedJpg(p,1400),u=URL.createObjectURL(im.blob),sec=document.createElement('article');sec.className='pp';sec.innerHTML=`<h1>${project.title} · ${p}p.</h1><img src="${u}"><h2>수업 중 코멘트</h2><div class="pnote"></div>`;sec.querySelector('.pnote').textContent=nm.get(p)||'';E.printArea.appendChild(sec)}setTimeout(()=>window.print(),100)};
E.backupInput.onchange=async e=>{if(!project)return alert('같은 PDF를 먼저 열어주세요.');try{const d=JSON.parse(await e.target.files[0].text());if(d.project.pageCount!==project.pageCount)return alert('페이지 수가 다른 백업입니다.');for(const n of d.notes||[])await put(NS,{key:`${project.id}:${n.page}`,projectId:project.id,page:n.page,text:String(n.text||''),updatedAt:Date.now()});for(const a of d.annotations||[])await put(AS,{key:`${project.id}:${a.page}`,projectId:project.id,page:a.page,strokes:a.strokes||[],pins:a.pins||[],updatedAt:Date.now()});await loadPageData();redrawInk();renderPins();toast('백업 복원 완료')}catch{alert('올바른 V2 백업 파일이 아닙니다.')}};
E.pdfInput.onchange=e=>openFile(e.target.files[0]);E.emptyPdf.onchange=e=>openFile(e.target.files[0]);E.editor.addEventListener('input',queueNote);E.prev.onclick=()=>go(currentPage-1);E.next.onclick=()=>go(currentPage+1);E.page.onchange=()=>go(E.page.value);E.time.onclick=()=>insert(`[${time()}] `);document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>insert(b.dataset.tag));E.title.addEventListener('input',()=>{if(!project)return;project.title=E.title.value;clearTimeout(window._tt);window._tt=setTimeout(()=>put(PS,project),300)});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=false;recognition.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';insert(s)};recognition.onend=()=>{listening=false;E.mic.style.background=''};E.mic.onclick=()=>{if(listening){recognition.stop();return}try{recognition.start();listening=true;E.mic.style.background='#fee2e2'}catch{}}}else E.mic.onclick=()=>alert('이 브라우저에서는 음성 입력을 지원하지 않습니다.');
window.addEventListener('resize',()=>{if(pdfDoc&&fit)renderPdf()});db=await openDb();const last=localStorage.getItem(LAST);if(last){const p=await get(PS,last);if(p?.pdfBlob)loadProject(p).catch(console.error)}

// V2 Apple Pencil only + finger edge navigation
let v2FingerStart=null;
function isStylusPointer(ev){
  if(ev.pointerType==='pen') return true;
  // iPad/Safari fallback: some Apple Pencil events may surface as touch-like pointers.
  const w=Number(ev.width||99),h=Number(ev.height||99),p=Number(ev.pressure||0);
  return ev.pointerType==='touch' && p>0 && w<=8 && h<=8;
}
E.inkCanvas.addEventListener('pointerup',ev=>{
  if(isStylusPointer(ev)||!v2FingerStart||!pdfDoc)return;
  const start=v2FingerStart;
  v2FingerStart=null;
  const d=Math.hypot(ev.clientX-start.x,ev.clientY-start.y),dt=Date.now()-start.t;
  if(start.moved||d>9||dt>450)return;
  // Only a short finger tap in the outer 10% changes page.
  if(start.rx<.10)go(currentPage-1);
  else if(start.rx>.90)go(currentPage+1);
},{passive:true});
E.inkCanvas.addEventListener('pointercancel',ev=>{
  if(!isStylusPointer(ev))v2FingerStart=null;
},{passive:true});
